name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json ausente. Gerando instalação não determinística; rode npm install localmente e versione o lockfile."
            npm install --no-audit --no-fund
          fi

      - name: Prevent accidental env commit
        shell: bash
        run: |
          tracked="$(git ls-files '.env' '.env.*' | grep -v '^.env.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Arquivos de ambiente versionados indevidamente:"
            echo "$tracked"
            exit 1
          fi

      - name: TypeScript
        run: npm run typecheck

      - name: Production bundle
        run: npm run build
